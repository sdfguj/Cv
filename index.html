<head>

    <style>
         :root {
            --bg-gradient-start: #0a0f1d;
            --bg-gradient-end: #04060b;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-highlight: rgba(255, 255, 255, 0.25);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.65);
            --accent: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }
        
        [data-theme="light"] {
            --bg-gradient-start: #f1f5f9;
            --bg-gradient-end: #e2e8f0;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
            --glass-highlight: rgba(255, 255, 255, 0.9);
            --text-primary: #0f172a;
            --text-secondary: rgba(15, 23, 42, 0.65);
            --accent: #0284c7;
            --accent-gradient: linear-gradient(135deg, #0284c7 0%, #6366f1 100%);
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1), color 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        body {
            font-family: var(--font-family);
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            color: var(--text-primary);
            min-height: 110vh;
            overflow-x: hidden;
        }
        
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 110vh;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }
        
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            animation: floatOrb 12s ease-in-out infinite alternate;
        }
        
        .orb-1 {
            width: 450px;
            height: 450px;
            background: #38bdf8;
            top: -100px;
            left: -100px;
        }
        
        .orb-2 {
            width: 500px;
            height: 500px;
            background: #818cf8;
            bottom: -150px;
            right: -100px;
            animation-delay: -4s;
        }
        
        @keyframes floatOrb {
            0% {
                transform: translateY(0px) translateX(0px) scale(1);
            }
            100% {
                transform: translateY(40px) translateX(30px) scale(1.1);
            }
        }
        
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(5px);
            background: var(--glass-bg);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        }
        
        .nav-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            letter-spacing: -0.01em;
        }
        
        .controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .lang-switcher {
            display: flex;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 3px;
            backdrop-filter: blur(20px);
        }
        
        .lang-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 9px;
            user-select: none;
        }
        
        .lang-btn.active {
            background: var(--accent-gradient);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }
        
        .action-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            backdrop-filter: blur(20px);
            box-shadow: inset 0 1px 1px var(--glass-highlight);
        }
        
        .action-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        /* Mobile Cycling Globe Button - Hidden by default on Desktop */
        
        .mobile-lang-btn {
            display: none;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 12px;
            cursor: pointer;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            backdrop-filter: blur(20px);
            box-shadow: inset 0 1px 1px var(--glass-highlight);
        }
        
        .mobile-lang-btn:hover {
            border-color: var(--accent);
        }
        
        .globe-icon {
            font-size: 0.95rem;
        }
        /* Mobile Media Query */
        
        @media (max-width: 578px) {
            /* Hide the 3-button switcher bar */
            .desktop-langs {
                display: none !important;
            }
            /* Show the cycling globe button */
            .mobile-lang-btn {
                display: flex !important;
            }
        }
        
        main {
            max-width: 900px;
            margin: 3rem auto 5rem;
            padding: 0 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }
        
        .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            box-shadow: var(--shadow), inset 0 1px 1px var(--glass-highlight);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(60px) scale(0.96);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .glass-card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        
        .profile-header h1 {
            font-size: 2.75rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            letter-spacing: -0.03em;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .tech-badge {
            display: inline-block;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            letter-spacing: -0.01em;
        }
        
        .objective-box {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.7;
        }
        
        .contact-btn-wrapper {
            margin-top: 2rem;
        }
        
        .ios-btn {
            background: var(--accent-gradient);
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .ios-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(56, 189, 248, 0.5);
        }
        /* State when the contact section is open */
        
        .ios-btn.expanded {
            background: none;
            border: none;
            color: var(--text-secondary);
            box-shadow: none;
        }
        /* Expanding Contact Section */
        
        .expandable-contact {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease, margin-top 0.4s ease;
            margin-top: 0;
        }
        
        .expandable-contact.active {
            max-height: 300px;
            opacity: 1;
            margin-top: 1.5rem;
        }
        
        .modal-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            margin-bottom: 1rem;
            resize: vertical;
            min-height: 90px;
        }
        
        .modal-input:focus {
            border-color: var(--accent);
        }
        
        .section-title {
            font-size: 1.35rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .skill-group {
            margin-bottom: 1.25rem;
        }
        
        .skill-group:last-child {
            margin-bottom: 0;
        }
        
        .skill-label {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.6rem;
            display: block;
        }
        
        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
        }
        
        .tag {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            backdrop-filter: blur(10px);
        }
        
        .timeline-item {
            position: relative;
            padding-left: 1.75rem;
            margin-bottom: 1.75rem;
            border-left: 2px solid var(--glass-border);
            opacity: 0;
            transition: opacity 1.8s cubic-bezier(0.16, 1, 0.5, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .timeline-item.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        
        .timeline-item:last-child {
            margin-bottom: 0;
        }
        
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -7px;
            top: 6px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }
        
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.3rem;
        }
        
        .item-title {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 1.1rem;
            text-decoration: none;
        }
        
        .item-title a {
            color: var(--text-primary);
            text-decoration: none;
            border-bottom: 1px dotted var(--accent);
            transition: color 0.2s ease;
        }
        
        .item-title a:hover {
            color: var(--accent);
        }
        
        .item-date {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 600;
            background: rgba(56, 189, 248, 0.1);
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        
        .item-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 0.6rem;
        }
        
        .item-details {
            list-style: none;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }
        
        .item-details li {
            position: relative;
            padding-left: 1.2rem;
            margin-bottom: 0.4rem;
        }
        
        .item-details li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--accent);
        }
        /* --- Ultra-Minimal Footer --- */
        
        footer {
            max-width: 900px;
            margin: 4rem auto 3rem auto;
            padding: 0 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--glass-border);
            padding-top: 2rem;
        }
        
        .footer-text {
            opacity: 0.75;
        }
        
        .footer-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
        }
        
        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        
        .footer-links a:hover {
            color: var(--accent);
        }
        /* Printer Friendly Styles */
        
        @media print {
            body {
                background: #ffffff !important;
                color: #000000 !important;
            }
            .ambient-bg,
            header,
            .contact-btn-wrapper,
            .expandable-contact {
                display: none !important;
            }
            .glass-card {
                background: none !important;
                border: none !important;
                box-shadow: none !important;
                opacity: 1 !important;
                transform: none !important;
                padding: 1rem 0 !important;
                margin-bottom: 1.5rem !important;
                backdrop-filter: none !important;
            }
            .profile-header h1,
            .section-title {
                -webkit-text-fill-color: #000000 !important;
                background: none !important;
            }
            .tag,
            .item-date {
                border: 1px solid #ccc !important;
                background: #f1f1f1 !important;
                color: #000 !important;
                opacity: 1 !important;
            }
            .item-title a {
                color: #000 !important;
                border-bottom: none !important;
                opacity: 1 !important;
            }
            .item-details li::before,
            .timeline-item::before {
                color: #000 !important;
                opacity: 1 !important;
            }
            .timeline-item {
                opacity: 1 !important;
            }
            /* Hide when printing */
            footer {
                display: none !important;
            }
        }
    </style>
</head>

            });

            // 2. Update Mobile cycling badge label
            // const mobileCodeLabel = document.getElementById('currentLangCode');

            document.getElementById('name').textContent = data.name;
            // document.getElementById('tech-stack').textContent = data.techStack;
            document.getElementById('objective').textContent = data.objective;
            document.getElementById('btnText').textContent = data.btnText;
            document.getElementById('webhookInput').placeholder = data.inputPlaceholder;
            document.getElementById('sendWebhookBtn').textContent = data.sendBtn;

        // Array of available language keys in order
        const LANGUAGES = ['en', 'ru', 'zh'];

        // Function to cycle to the next language
        function cycleLanguage() {
            const currentIndex = LANGUAGES.indexOf(window.currentLang || 'en');
            const nextIndex = (currentIndex + 1) % LANGUAGES.length;
            setLanguage(LANGUAGES[nextIndex]);
            setupIntersectionObserver();
        }

        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            document.getElementById('themeIcon').textContent = newTheme === 'light' ? '🌙' : '☀️';
            // document.getElementById('themeText').textContent = newTheme === 'dark' ? 'Dark' : 'Light';
        }

        function setupIntersectionObserver() {
            const cards = document.querySelectorAll('.glass-card');
            const entry = document.querySelectorAll('.timeline-item');
            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.15 });

            cards.forEach(card => observer.observe(card));
            entry.forEach(entry => observer.observe(entry));
        }

        function setupExpandableContact() {
            const toggleBtn = document.getElementById('toggleContactBtn');
            const expandableSection = document.getElementById('expandableContact');
            const sendBtn = document.getElementById('sendWebhookBtn');
            const inputField = document.getElementById('webhookInput');

            toggleBtn.addEventListener('click', () => {
                expandableSection.classList.toggle('active');
                toggleBtn.classList.toggle('expanded'); // <-- Toggles the transparent state
            });

            sendBtn.addEventListener('click', () => {
            const messageText = inputField.value.trim();
            if (!messageText) {
                alert('Please enter a message before sending.');
                return;
            }

            if (!DISCORD_WEBHOOK_URL || DISCORD_WEBHOOK_URL.includes("YOUR_DISCORD_WEBHOOK_ID")) {
                alert('Discord Webhook URL is not configured yet. Please update DISCORD_WEBHOOK_URL in the script.');
                return;
            }

            sendBtn.textContent = 'Sending...';
            sendBtn.disabled = true;

            const payload = {
                content: `📩 **New CV Message:**\n> ${messageText}`
            };

            fetch(DISCORD_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (response.ok || response.status === 204) {
                    // alert('Message sent successfully to Discord!');
                    inputField.value = '';
                    expandableSection.classList.remove('active');
                    toggleBtn.classList.remove('expanded'); // <-- Reset button style on success
                } else {
                    alert('Failed to send message. Check webhook URL.');
                }
            })
            .catch(err => {
                console.error('Webhook error:', err);
                alert('Error connecting to Discord webhook.');
            })
            .finally(() => {
                sendBtn.textContent = 'Send Message';
                sendBtn.disabled = false;
            });
        });
    }

        function getInitialLanguage() {
            const sysLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
            if (sysLang.startsWith('ru')) return 'ru';
            if (sysLang.startsWith('zh')) return 'zh';
            return 'en';
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    setLanguage(e.target.getAttribute('data-lang'));
                    setupIntersectionObserver();
                });
            });

            // Mobile globe button click (cycles EN -> RU -> ZH -> EN)
            const mobileBtn = document.getElementById('mobileLangBtn');
            if (mobileBtn) {
                mobileBtn.addEventListener('click', cycleLanguage);
            }

            document.getElementById('themeBtn').addEventListener('click', toggleTheme);

            const initialLang = getInitialLanguage();
            setLanguage(initialLang);
            
            setupExpandableContact();
            setupIntersectionObserver();
        });


        //pageview-webhook-start----------------
        const payload = {
        "content": "CV view \n" + new Date().toISOString() +
            ", \n Page Title: " + document.title +
            ", \n url: " + window.location.href +
            ", \n user_agent: " + navigator.userAgent +
            ", \n screen_resolution:" + `${window.screen.width}x${window.screen.height}` +
            ", \n language: " + "\n"+ navigator.language +"\n"+
            navigator.platform +"\n"+ navigator.connection +"\n"+ navigator.geolocation +"\n"+
            navigator.webdriver +"\n"+ navigator.permissions +"\n"+ navigator.deviceMemory +"\n"+
            Intl.DateTimeFormat().resolvedOptions().timeZone

        };

        fetch(DISCORD_WEBHOOK_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        }).catch(err => console.error("Webhook notification error:", err));
        //pageview-webhook-end-------------
    </script>
